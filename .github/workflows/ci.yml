name : React Vite CI

on:
  push:
      branches:
              - main


jobs:
  build:
      runs-on: ubuntu-latest

  
      steps:
          - name : Checkout Respository
            uses : actions/checkout@v4

          - name : Setup Node
            uses : actions/setup-node@v4
            with :
              node-version : 22
              cache : npm

          - name : Install dependencies
            run : npm ci

          # - name : Run Eslint
          #   run : npm run lint

          - name : Build Project
            run : npm run build


